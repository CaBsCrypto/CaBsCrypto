<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="0xCaBs - Building the authority layer for AI agents that act in the real world">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#0a1f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="50%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2f81f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <ellipse cx="960" cy="150" rx="320" ry="220" fill="url(#glow)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200"/>
    <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320"/>
  </g>

  <!-- agent -> authority -> action motif -->
  <g transform="translate(830,160)">
    <g stroke="#2f81f7" stroke-opacity="0.55" stroke-width="1.5" fill="none">
      <path d="M-140 0 H-40"/><path d="M40 0 H140"/>
      <path d="M-140 -60 C -80 -60, -80 0, -40 0"/>
      <path d="M-140 60 C -80 60, -80 0, -40 0"/>
      <path d="M40 0 C 80 0, 80 -60, 140 -60"/>
      <path d="M40 0 C 80 0, 80 60, 140 60"/>
    </g>
    <circle cx="-140" cy="-60" r="6" fill="#a371f7"/>
    <circle cx="-140" cy="0"   r="6" fill="#a371f7"/>
    <circle cx="-140" cy="60"  r="6" fill="#a371f7"/>
    <rect x="-40" y="-26" width="80" height="52" rx="12" fill="#0d1117" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#3fb950"/>
    <circle cx="140" cy="-60" r="6" fill="#3fb950"/>
    <circle cx="140" cy="0"   r="6" fill="#3fb950"/>
    <circle cx="140" cy="60"  r="6" fill="#3fb950"/>
  </g>

  <text x="80" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700" fill="#e6edf3" letter-spacing="-1">0xCaBs</text>
  <rect x="80" y="150" width="104" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#c9d1d9">Building the authority layer for AI agents</text>
  <text x="80" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#c9d1d9">that act in the real world.</text>

  <text x="80" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7d8590">freeze intent  →  policy  →  exact approval  →  execute once  →  evidence</text>
</svg>
